plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gathin.tvhome'
    compileSdk 34

    defaultConfig {
        applicationId 'com.gathin.tvhome'
        minSdk 26
        targetSdk 29
        // Keep at 2 while ~/.local/share/firetv-debloat/rollback holds a versionCode-2 launcher: an equal
        // version installs over in both directions, a lower one would need a downgrade Fire OS refuses.
        versionCode 2
        versionName '2.0'
    }

    buildTypes {
        release {
            // R8 removes the unused library code and resources (~6 MB debug APK down to well under 1 MB).
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Same key as the debug build, so the release APK installs over the one on the TV.
            signingConfig signingConfigs.debug
        }
    }

    lint {
        // The launcher is sideloaded over ADB, never published to Google Play, so Play's minimum targetSdk
        // does not apply; without this, lintVitalRelease fails assembleRelease.
        disable 'ExpiredTargetSdkVersion'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    testImplementation 'junit:junit:4.13.2'
}
